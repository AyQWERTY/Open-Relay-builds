name: Build Open-Relay IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v6.4.1)"
        required: true
      publish:
        description: "release (default) or artifact"
        default: "release"

# one shared queue: builds must finish in tag order so the newest version is
# created last and becomes the "latest" release
concurrency:
  group: build-open-relay

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26-intel
    permissions:
      contents: write

    steps:
      - name: Stop if this tag is already released
        id: already
        run: |
          if [ "$PUBLISH" = "release" ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "$TAG is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}

      - name: Checkout upstream at the tag
        if: steps.already.outputs.released != 'true'
        uses: actions/checkout@v4
        with:
          repository: Ichigo3766/Open-Relay
          ref: ${{ inputs.tag }}

      - name: Extract release notes from CHANGELOG
        if: steps.already.outputs.released != 'true'
        run: |
          awk -v tag="$TAG" '
            $1 == "##" {
              if (seen) exit
              if ($2 == tag) {
                seen = 1
                print
                print ""
                print "[`" tag "`](https://github.com/Ichigo3766/Open-Relay/tree/" tag ") | [Open Relay](https://github.com/Ichigo3766/Open-Relay)"
              }
              next
            }
            seen { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "CHANGELOG has no section for $TAG" >&2
            exit 1
          fi
        env:
          TAG: ${{ inputs.tag }}

      - name: Fix asset filenames that do not match Contents.json
        if: steps.already.outputs.released != 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for catalog in Path.cwd().rglob("Contents.json"):
              data = json.loads(catalog.read_text())
              names = {f.name for f in catalog.parent.iterdir() if f.is_file()}
              for entry in data.get("images", []) + data.get("colors", []):
                  name = entry.get("filename")
                  if not name or name in names:
                      continue
                  actual = next((n for n in names if n.lower() == name.lower()), None)
                  if actual:
                      print(f"{catalog}: '{name}' -> '{actual}'")
                      entry["filename"] = actual
              catalog.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Setup latest Xcode
        if: steps.already.outputs.released != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Download Metal Toolchain
        if: steps.already.outputs.released != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build Xcode Project
        if: steps.already.outputs.released != 'true'
        run: |
          xcodebuild clean build \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -debug-time-expression-type-checking -Xfrontend -solver-expression-time-threshold=100000 -Xfrontend -solver-memory-threshold=4294967295 -Xfrontend -solver-scope-threshold=4294967295 -Xfrontend -solver-trail-threshold=4294967295'

      - name: Package into IPA
        if: steps.already.outputs.released != 'true'
        run: |
          mkdir Payload
          mv "build/Build/Products/Release-iphoneos"/*.app Payload/
          zip -qr "Open-Relay-$TAG.ipa" Payload
        env:
          TAG: ${{ inputs.tag }}

      - name: Create release
        if: steps.already.outputs.released != 'true' && inputs.publish == 'release'
        run: |
          gh release create "$TAG" "Open-Relay-$TAG.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-body.md
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload IPA as artifact
        if: steps.already.outputs.released != 'true' && inputs.publish == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Open-Relay-${{ inputs.tag }}
          path: Open-Relay-${{ inputs.tag }}.ipa
