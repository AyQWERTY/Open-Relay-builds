name: Xcode version probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v6.4.1)"
        required: true
        default: v6.4.1

concurrency:
  group: xcode-probe

jobs:
  probe:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            xcode: "27"

    steps:
      - name: Show installed Xcode versions
        run: ls /Applications | grep -i "^Xcode"

      - name: Checkout upstream at the tag
        uses: actions/checkout@v4
        with:
          repository: Ichigo3766/Open-Relay
          ref: ${{ inputs.tag }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Show active toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project "Open UI.xcodeproj" \
            -scheme "Open UI" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=100000 -Xfrontend -solver-memory-threshold=4294967295 -Xfrontend -solver-scope-threshold=4294967295 -Xfrontend -solver-trail-threshold=4294967295'

      - name: Report outcome
        run: |
          if ls "build/Build/Products/Release-iphoneos"/*.app >/dev/null 2>&1; then
            echo "PASS: built app found"
          else
            echo "FAIL: no built app" >&2
            exit 1
          fi
